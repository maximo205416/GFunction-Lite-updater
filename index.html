<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GFunction Update</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f3f6;
    color: #222;
    padding: 30px 15px;
}

.container {
    max-width: 500px;
    margin: 30px auto;
    background: white;
    padding: 30px;
    border-radius: 22px;
    box-shadow: 0 5px 25px #00000010;
    text-align: center;
}

.logo img {
    width: 80px;
    height: 80px;
    object-fit: contain;
}

h1 {
    margin-bottom: 5px;
}

.subtitle {
    color: #777;
    margin-bottom: 30px;
}

.version-box {
    background: #f5f7fa;
    padding: 20px;
    border-radius: 15px;
    margin: 20px 0;
}

.version {
    font-size: 25px;
    font-weight: bold;
    margin: 10px 0;
}

.status {
    color: #777;
    font-size: 14px;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #2878f0;
    color: white;
    font-size: 16px;
    cursor: pointer;
    margin-top: 12px;
}

button:hover {
    background: #1764d5;
}

.download {
    display: none;
    background: #18a558;
}

.download:hover {
    background: #128746;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    margin-top: 10px;
}

.message {
    margin-top: 20px;
    font-size: 14px;
    color: #666;
}

footer {
    margin-top: 30px;
    color: #999;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
    <img src="gfunction%20logo.png" alt="GFunction Lite">
</div>

    <h1>GFunction Update</h1>
    <p class="subtitle">Actualizador oficial de GFunction Lite</p>

    <div class="version-box">
        <p>Última versión disponible</p>
        <div class="version" id="latestVersion">Buscando...</div>
        <div class="status" id="versionStatus">Conectando con GitHub...</div>
    </div>

    <input
        type="text"
        id="installedVersion"
        placeholder="Versión instalada (ej. V1.2 Beta3)"
    >

    <button onclick="checkUpdate()">
        Buscar actualizaciones
    </button>

    <button class="download" id="downloadButton" onclick="downloadUpdate()">
        Descargar actualización
    </button>

    <div class="message" id="message"></div>

    <footer>
        GFunction Lite · GFunction Update
    </footer>

</div>

<script>
const GITHUB_OWNER = "maximo205416";
const GITHUB_REPO = "GFunction-Lite";
const GITHUB_BRANCH = "main";

// Carpeta donde están los archivos de versiones.
// Si están en la raíz del repositorio, déjalo vacío.
const VERSIONS_PATH = "";

let latestFile = null;

// Convierte los nombres de archivo en versiones comparables.
function parseVersion(filename) {
    const match = filename.match(
        /^GFunction-Lite_V(\d+)\.(\d+)(?:\.(\d+))?(?:_Beta(\d+))?\.txt$/i
    );

    if (!match) return null;

    return {
        major: Number(match[1]),
        minor: Number(match[2]),
        patch: Number(match[3] || 0),
        beta: match[4] !== undefined ? Number(match[4]) : null,
        filename
    };
}

// Compara dos versiones.
// Una versión estable tiene prioridad sobre las betas
// de exactamente el mismo número.
function compareVersions(a, b) {
    for (const key of ["major", "minor", "patch"]) {
        if (a[key] !== b[key]) {
            return a[key] - b[key];
        }
    }

    if (a.beta === null && b.beta !== null) return 1;
    if (a.beta !== null && b.beta === null) return -1;

    if (a.beta !== null && b.beta !== null) {
        return a.beta - b.beta;
    }

    return 0;
}

function formatVersion(version) {
    let result = `V${version.major}.${version.minor}`;

    if (version.patch > 0) {
        result += `.${version.patch}`;
    }

    if (version.beta !== null) {
        result += ` Beta${version.beta}`;
    }

    return result;
}

// Consulta GitHub y detecta la versión más reciente.
async function loadVersions() {
    const latestElement = document.getElementById("latestVersion");
    const statusElement = document.getElementById("versionStatus");

    try {
        const path = VERSIONS_PATH
            ? encodeURIComponent(VERSIONS_PATH).replace(/%2F/g, "/") + "/"
            : "";

        const apiURL =
            `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}?ref=${GITHUB_BRANCH}`;

        const response = await fetch(apiURL, {
            headers: {
                "Accept": "application/vnd.github+json"
            },
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("No se pudo consultar GitHub.");
        }

        const files = await response.json();

        const versions = files
            .filter(file => file.type === "file")
            .map(file => parseVersion(file.name))
            .filter(Boolean);

        if (versions.length === 0) {
            throw new Error("No se encontraron versiones.");
        }

        versions.sort(compareVersions);

        const latest = versions[versions.length - 1];

        latestFile = files.find(file => file.name === latest.filename);

        latestElement.textContent = formatVersion(latest);
        statusElement.textContent = "Última versión disponible";

        return latest;

    } catch (error) {
        latestElement.textContent = "No disponible";
        statusElement.textContent = "Error de conexión";
        document.getElementById("message").textContent = error.message;
        return null;
    }
}

// Comprueba la versión introducida por el usuario.
async function checkUpdate() {
    const input = document.getElementById("installedVersion").value.trim();
    const message = document.getElementById("message");
    const button = document.getElementById("downloadButton");

    button.style.display = "none";
    message.textContent = "Comprobando...";

    const installed = parseVersion(
        input.replace(/\s+/g, "")
            .replace(/^V(\d+\.\d+)(?:Beta(\d+))?$/i,
                (_, version, beta) =>
                    `GFunction-Lite_V${version}${beta ? "_Beta" + beta : ""}.txt`)
    );

    if (!installed) {
        message.textContent = "Introduce una versión válida. Ejemplo: V1.2 Beta3";
        return;
    }

    const latest = await loadVersions();

    if (!latest) return;

    const comparison = compareVersions(latest, installed);

    if (comparison > 0) {
        message.textContent =
            "¡Hay una actualización disponible!";
        button.style.display = "block";
    } else if (comparison === 0) {
        message.textContent =
            "Ya tienes la última versión.";
    } else {
        message.textContent =
            "Tu versión es superior a la última publicada en GitHub.";
    }
}

// Descarga el archivo detectado.
function downloadUpdate() {
    if (!latestFile || !latestFile.download_url) return;

    window.location.href = latestFile.download_url;
}

// Buscar la última versión al abrir la página.
loadVersions();
</script>

</body>
</html>
